name: Deploy Pharmab2b

on:
  push:
    branches:
      - main
      - test/sergey

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Select deployment target
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in

            main)
              echo "folder=/var/www/pharmab2b/httpdocs" >> "$GITHUB_OUTPUT"
              ;;

            test/sergey)
              echo "folder=/var/www/pharmab2b/test-sergey" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "ERROR: Unknown branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            DEPLOY_DIR="${{ steps.deploy.outputs.folder }}"
            BRANCH="${{ steps.deploy.outputs.branch }}"

            echo "========================================"
            echo "DEPLOY START"
            echo "Branch: $BRANCH"
            echo "Folder: $DEPLOY_DIR"
            echo "========================================"

            cd "$DEPLOY_DIR"

            echo "Current directory:"
            pwd

            echo "Fetching latest changes..."
            git fetch origin "$BRANCH"

            echo "Switching to branch..."
            git checkout "$BRANCH"

            echo "Resetting to origin/$BRANCH..."
            git reset --hard "origin/$BRANCH"

            CURRENT_BRANCH="$(git branch --show-current)"

            if [ "$CURRENT_BRANCH" != "$BRANCH" ]; then
              echo "ERROR: Expected branch '$BRANCH', got '$CURRENT_BRANCH'"
              exit 1
            fi

            echo "Current branch:"
            git branch --show-current

            echo "Current commit:"
            git log -1 --oneline

            echo "Clearing Webasyst cache..."
            php wa-system/cli.php clearCache

            echo "========================================"
            echo "DEPLOY SUCCESS"
            echo "========================================"
