{**
  * Template for render !deal_attachments field in constructor
  *}
{$class_id = 'crm-attachments-wrapper'}
{$wrapper_id = uniqid($class_id)}
<div class="{$class_id}" id="{$wrapper_id}">
    <div class="crm-attachments">
        <div class="crm-attachment-picker">
            <div class="crm-attachment-drop">
                <span class="crm-attachment-trigger" title="[`Attach files`]">
                    <i class="fas fa-paperclip"></i>
                </span>
                <input type="file" name="crm_form_deal_attachment[]" class="crm-attachment-input crm-attachment-input--picker" multiple>
            </div>
        </div>
        <div class="crm-attachment-list">
            <span class="crm-attachment-empty hint">[`No files selected`]</span>
        </div>
        <div class="crm-attachment" data-template="1" style="display: none;">
            <span class="crm-attachment-badge">
                <span class="crm-attachment-filename"></span>
                <a href="javascript:void(0);" class="c-remove-attachment" title="[`Remove`]">&times;</a>
            </span>
        </div>
    </div>
    <script>
        (function ($) {

            var $wrapper = $('#{$wrapper_id}'),
                $list = $wrapper.find('.crm-attachment-list'),
                $empty = $wrapper.find('.crm-attachment-empty'),
                $picker = $wrapper.find('.crm-attachment-picker'),
                $template = $wrapper.find('.crm-attachment[data-template="1"]');

            var updateEmptyHint = function() {
                $empty.toggle($list.children('.crm-attachment').length === 0);
            };

            var createFileInput = function(file) {
                var $input = $('<input type="file" name="crm_form_deal_attachment[]" class="crm-attachment-input crm-attachment-input--stored">');
                if (typeof DataTransfer !== 'undefined') {
                    var dt = new DataTransfer();
                    dt.items.add(file);
                    $input[0].files = dt.files;
                }
                $input.hide();
                return $input;
            };

            var resetPicker = function() {
                $picker.find('.crm-attachment-input--picker').remove();
                $picker.find('.crm-attachment-drop').append(
                    $('<input type="file" name="crm_form_deal_attachment[]" class="crm-attachment-input crm-attachment-input--picker" multiple>')
                );
            };

            $wrapper.on('click', '.crm-attachment-trigger', function(e) {
                e.preventDefault();
                $picker.find('.crm-attachment-input--picker').trigger('click');
            });

            $wrapper.on('change', '.crm-attachment-input--picker', function() {
                var input = this,
                    files = input.files;

                if (!files || !files.length) {
                    return;
                }

                for (var i = 0; i < files.length; i++) {
                    var $attachment = $template.clone();
                    $attachment.data('template', '').attr('data-template', '').show();
                    $attachment.find('.crm-attachment-filename').text(files[i].name);
                    $attachment.find('.crm-attachment-badge').append(createFileInput(files[i]));
                    $list.append($attachment);
                }

                resetPicker();
                updateEmptyHint();
            });

            $wrapper.on('click', '.c-remove-attachment', function(e) {
                e.preventDefault();
                $(this).closest('.crm-attachment').remove();
                updateEmptyHint();
            });
        })(jQuery);
    </script>
</div>
