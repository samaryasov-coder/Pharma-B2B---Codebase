<form class="js-form form fields" action="?module=esklp&action=save">
    {if !empty($object.id)}
        <input type="hidden" name="id" value="{$object.id|escape}">
    {/if}
    <div class="field">
        <div class="name">Стандартизованное МНН</div>
        <div class="value">
            <input type="text" name="data[name]" value="{$object.name|default:''|escape}" class="w100"><br>
        </div>
    </div>
    <div class="field">
        <div class="name">Код узла СМНН</div>
        <div class="value">
            <input type="text" name="data[code]" value="{$object.code|default:''|escape}" class="w100"><br>
        </div>
    </div>
    <div class="field">
        <div class="name">Стандартизованная лекарственная форма</div>
        <div class="value">
            <input type="text" name="data[form]" value="{$object.form|default:''|escape}" class="w100"><br>
        </div>
    </div>
    <div class="field">
        <div class="name">Стандартизованная дозировка</div>
        <div class="value">
            <input type="text" name="data[dose]" value="{$object.dose|default:''|escape}" class="w100"><br>
        </div>
    </div>
    <div class="field">
        <div class="name">Единица измерения</div>
        <div class="value">
            <input type="text" name="data[unit]" value="{$object.unit|default:''|escape}" class="w100"><br>
        </div>
    </div>
    <div class="field">
        <div class="name">Коэффициент</div>
        <div class="value">
            <input type="text" name="data[coef]" value="{$object.coef|default:''|escape}" class="w100"><br>
        </div>
    </div>
    <div class="field">
        {include $app_path|cat:'/templates/includes/include.message.html'}
    </div>
    <div class="field">
        <input type="submit" class="button" value="Сохранить">
        <span class="js-form-message form-message red" style="display: none;"></span>
    </div>
</form>
