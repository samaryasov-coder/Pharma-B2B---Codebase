<div id="dialog" data-title="Контактные данные компании">
    <form id="form-data-edit" class="form content" action="/cabinet/company-data/save/">

        <div class="input-wrap required">
            <label class="input-label" for="registry_email">Основной E-mail</label>
            <div class="input-box">
                <input id="registry_email" name="company[registry_email]" type="text" class="input" placeholder="Введите свой E-mail" value="{$company.data.registry_email|escape}">
            </div>
            <span class="input-hint"></span>
        </div>

        <div class="input-wrap required">
            <label class="input-label" for="phone">Основной номер телефона</label>
            <div class="input-box">
                <input id="phone" name="company[phone]" type="text" class="input mask_phone" placeholder="Введите свой номер телефона" value="{$company.data.phone|escape}">
            </div>
            <span class="input-hint"></span>
        </div>

        <div class="input-wrap required">
            <label class="input-label" for="site">Веб-сайт</label>
            <div class="input-box">
                <input id="site" name="company[site]" type="text" class="input" placeholder="Укажите адрес сайта компании" value="{$company.data.site|escape}">
            </div>
            <span class="input-hint"></span>
        </div>

    </form>

    <div class="form-actions">
        <button class="button primary large" type="submit" form="form-data-edit">Сохранить</button>
    </div>
</div>
