<div id="dialog" data-title="Укажите причину отклонения заявки" class="form-container">
    <div class="content">
        <form id="request-reject-form" class="form">
            <div class="files-list">
                {foreach $template_list as $template}
                    <div class="file-item" data-id="{$template.id}">
                        <div class="file-row">
                            <div class="file-info">
                            <span class="file-icon icon square">
                                <svg><use href="#icon-document-text"></use></svg>
                            </span>

                                <div class="file-data">
                                    <div class="file-name">
                                        {$template.template_name}.{$template.file.ext}
                                    </div>
                                </div>
                            </div>

                            <label class="checkbox destruct">
                                <input type="checkbox" name="file-checkbox" class="file-checkbox">
                                <span class="checkmark"></span>
                            </label>
                        </div>

                        <div class="textarea-box file-comment">
                            <textarea class="comment" name="comment" maxlength="300" placeholder="Введите причину"></textarea>
                            <div class="char-counter">0/200</div>
                        </div>
                    </div>
                {/foreach}
            </div>
        </form>
    </div>

    <div class="form-actions">
        <button class="button secondary large modal-cancel">
            Отмена
        </button>

        <button class="button destruct large" type="submit" form="request-reject-form">
            Отклонить
        </button>
    </div>
</div>

<style>
    .files-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .file-item {
        display: grid;
        border: 1px solid #E4E7EC;
        border-radius: 10px;
        padding: 14px;
        width: 100%;
        justify-content: stretch;
    }

    .file-row {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .file-info {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
    }

    .file-icon.icon.square {
        background-color: transparent;
        width: fit-content;
        height: fit-content;
        border: 1px solid var(--gray-200);
        padding: 12px;
    }

    .file-name {
        font-size: 14px;
        line-height: 20px;
        word-break: break-word;
    }

    .file-comment {
        display: none;
        margin-top: 12px;
    }

    .file-comment textarea {
        min-height: 90px;
        resize: vertical;
    }
</style>
