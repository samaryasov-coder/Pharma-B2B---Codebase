<form class="auth-form auth-password" action="/password/" method="POST">
    <a href="/auth/login/" class="auth-form__back button text">
        <i class="fas fa-chevron-left"></i>
        <span>Назад</span>
    </a>
    <div class="auth-form__body">
        <div class="auth-form__auth-flow">
            <span class="text-h1 fw-bold">Придумайте пароль</span>
            <div class="auth-form__fields">
                <div class="input-wrap large">
                    <label class="input-label" for="password">Пароль</label>
                    <div class="input-box">
                        <input id="password" name="password" type="password" class="input" placeholder="Новый пароль">
                        <div class="input-postfix">
                            <button type="button" class="input-icon js-password-toggle">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <span class="input-hint"></span>
                    <ul class="auth-form__password-rules text-p3 fw-regular gray-600">
                        <li data-rule="length">Минимум 8 символов</li>
                        <li data-rule="uppercase">Буквы в верхнем регистре (A-Z)</li>
                        <li data-rule="lowercase">Буквы в нижнем регистре (a-z)</li>
                        <li data-rule="number">Цифры (0-9)</li>
                        <li data-rule="special">Спецсимвол (!@-#?)</li>
                    </ul>
                </div>
                <div class="input-wrap large">
                    <label class="input-label" for="password_confirmation">Повторите пароль</label>
                    <div class="input-box">
                        <input id="password_confirmation" name="password_confirmation" type="password" class="input" placeholder="Повторите пароль">
                        <div class="input-postfix">
                            <button type="button" class="input-icon js-password-toggle">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <span class="input-hint"></span>
                </div>
            </div>
        </div>
        <div class="auth-form__actions">
            <button class="button primary large" type="submit" disabled>Сохранить пароль</button>
        </div>
    </div>
</form>


<script>
    $(function () {
        $.Auth.Password.init();
    });
</script>
